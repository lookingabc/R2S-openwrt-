name: Build R2S OpenWrt

on:
  workflow_dispatch:
    inputs:
      ref:
        description: OpenWrt tag or branch
        default: v25.12.6
      turboacc:
        description: Add Turbo ACC (patches the kernel)
        type: boolean
        default: true
      rootfs_size:
        description: Rootfs partition size in MB
        default: "2048"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REF: ${{ inputs.ref }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-pyelftools libelf-dev rsync swig unzip \
            zlib1g-dev file wget xsltproc

      - name: Clone OpenWrt
        run: git clone --depth 1 --branch "$REF" https://github.com/openwrt/openwrt.git openwrt

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |
          cp feeds.conf.default feeds.conf
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf
          echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf

      - name: Add Turbo ACC
        if: ${{ inputs.turboacc }}
        working-directory: openwrt
        run: |
          curl -fsSL https://raw.githubusercontent.com/chenmozhijin/turboacc/luci/add_turboacc.sh -o add_turboacc.sh
          bash add_turboacc.sh

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          # remove the official copies so the PassWall feed versions are used
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          ./scripts/feeds install -a -f -p passwall_packages
          ./scripts/feeds install -a

      - name: Apply config
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/r2s.config" .config
          sed -i "s/^CONFIG_TARGET_ROOTFS_PARTSIZE=.*/CONFIG_TARGET_ROOTFS_PARTSIZE=$ROOTFS_SIZE/" .config
          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Compile
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect images
        run: |
          mkdir out
          cp openwrt/bin/targets/rockchip/armv8/*friendlyarm_nanopi-r2s* out/
          cp openwrt/.config out/build.config
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: r2s-openwrt
          path: out/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: r2s-${{ inputs.ref }}-${{ github.run_number }}
          name: R2S ${{ inputs.ref }} #${{ github.run_number }}
          files: out/*
